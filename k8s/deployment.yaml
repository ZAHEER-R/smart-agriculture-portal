apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-portal
  labels:
    app: smart-agri
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agri
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: smart-agri
    spec:
      containers:
      - name: portal
        image: <your-dockerhub-username>/smart-agri-portal:v1
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
